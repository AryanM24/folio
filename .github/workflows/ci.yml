name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build
      - name: Build tests
        run: swift build --build-tests
      # One process per test target, and per suite for the conversion engine. Run together
      # on the 3-core runner, the suites starve Swift's shared thread pool and the run
      # stalls; each on its own is quick.
      - name: Test
        run: |
          set -euo pipefail
          for target in $(ls Tests); do
            if [ "$target" = FolioConvertTests ]; then
              filters=$(ls Tests/FolioConvertTests/*Tests.swift | xargs -n1 basename | sed 's/\.swift$//; s/^/FolioConvertTests./')
            else
              filters=$target
            fi
            for filter in $filters; do
              echo "::group::$filter"
              swift test --skip-build --filter "$filter"
              echo "::endgroup::"
            done
          done
      - name: Lint
        run: swift format lint --recursive --strict Sources Tests Package.swift
      - name: Bundle the app
        run: scripts/bundle.sh release
